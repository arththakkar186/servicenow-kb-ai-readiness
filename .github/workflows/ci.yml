name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Full pipeline against the mock instance
        run: python -m kbprep run --out out
      - name: Library contains no PII patterns
        run: |
          ! grep -REn "@corp\.example|intranet\.corp\.example|416-555-[0-9]{4}" out/library/
